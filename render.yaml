# Render.com Blueprint - https://render.com/docs/blueprint-spec
# Deploy with: Connect your GitHub repo to Render, and it will auto-detect this file.

databases:
  - name: wallet-platform-db
    plan: free
    databaseName: walletdb
    user: walletuser

services:
  # Backend API - Spring Boot (Docker)
  - type: web
    name: wallet-platform-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_HOST
        fromDatabase:
          name: wallet-platform-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: wallet-platform-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: wallet-platform-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: wallet-platform-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: wallet-platform-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@walletplatform.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://wallet-platform-frontend.onrender.com
      - key: PORT
        value: "8080"
    healthCheckPath: /api/rates

staticSites:
  # Frontend - React Static Site
  - name: wallet-platform-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://wallet-platform-api.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
